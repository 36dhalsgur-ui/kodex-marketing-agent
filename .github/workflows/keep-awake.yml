name: 앱 깨우기 유지

# Streamlit Community Cloud는 트래픽이 12시간 없으면 앱을 재우고, 다음 방문자에게
# 'Yes, get this app back up!' 화면을 띄운다. 포트폴리오 링크로 쓰는 동안은 그
# 화면이 뜨지 않는 편이 낫다.
#
# curl로는 안 된다(실측 2026-09-05). 여기서 세는 '트래픽'은 HTML 요청이 아니라
# 실제 세션이라, HTTP 200을 세 번 받고도 앱은 잠들었다. 그래서 실제 브라우저로 연다.
#
# 간격 — GitHub 스케줄은 정시에 안 돈다. 실측 지연이 최대 3시간 43분이었다
# (06:00 예정 → 09:43 실행). 4시간 간격이면 크게 밀려도 12시간 안에 한 번은 닿는다.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright 설치
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: 앱 접속
        env:
          APP_URL: https://kodex-marketing-agent-tebne4rb46g2w9mgwcbgaa.streamlit.app
        run: python scripts/keep_awake.py
