name: 주간 데이터 갱신

# 토요일 09:00 KST = 토요일 00:00 UTC
#
# 로컬 launchd가 금요일 21:00 KST에 같은 계정으로 돈다. KRX 공식 계정은 동시 세션을
# 하나만 허용해서, 두 경로가 같은 시각에 겹치면 서로의 세션을 무효화하고 이후 조회가
# 전부 'LOGOUT'으로 실패한다(실측 2026-07-31 — 26개 섹터 중 15개 유실).
# Actions는 로컬이 꺼져 있거나 실패했을 때의 백업이므로 12시간 뒤로 뗀다.
# 아래 '로컬 결과 확인' 단계에서 이번 주 데이터가 이미 있으면 스스로 건너뛴다.
on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

# 데이터 커밋·푸시 권한
permissions:
  contents: write

concurrency:
  group: weekly-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    # 로컬(국내 IP) 실행이 약 68분. GitHub 러너는 미국 IP라 KRX 왕복이 더 느려
    # 60분으로는 매번 타임아웃된다(실측: 정확히 60분에 cancelled). 공개 저장소라
    # Actions 사용량 제한이 없으므로 넉넉히 잡는다.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pykrx는 로컬 배치 전용이라 requirements.txt에 없다(배포 런타임에 불필요).
      # 여기서만 따로 설치한다.
      - name: 의존성 설치
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q pandas numpy requests beautifulsoup4 pykrx

      # 로컬이 이미 이번 주분을 올렸으면 돌 이유가 없다. 같은 계정으로 또 로그인하면
      # 로컬 세션까지 끊을 수 있으므로, 백업은 필요할 때만 돈다. 수동 실행은 항상 돈다.
      - name: 로컬 결과 확인
        id: fresh
        env:
          TZ: Asia/Seoul
          EVENT: ${{ github.event_name }}
        run: |
          # 문자열 비교 대신 파이썬에서 날짜로 판단한다 — 셸 비교 연산자는 미묘하다.
          run=$(python - <<'EOF'
          import json, os
          from datetime import date, timedelta
          try:
              asof = json.load(open("data/signal_board.json")).get("asof", "")
          except Exception:
              asof = ""
          today = date.today()
          friday = today - timedelta(days=(today.weekday() - 4) % 7)   # 직전(또는 오늘) 금요일
          manual = os.environ.get("EVENT") != "schedule"
          fresh = asof >= friday.isoformat()
          print(f"asof={asof} · 기준 금요일={friday} · 수동={manual} · 최신={fresh}")
          print("no" if (fresh and not manual) else "yes")
          EOF
          )
          echo "$run"
          echo "run=$(echo "$run" | tail -1)" >> "$GITHUB_OUTPUT"

      - name: 배치 실행 · 커밋 · 푸시
        if: steps.fresh.outputs.run == 'yes'
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: bash scripts/run_weekly.sh

      # 실패해도 어디까지 됐는지 보이도록 산출물을 남긴다
      - name: 산출물 업로드 (실패 시 진단용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: data/*.json
          retention-days: 7
