name: 주간 데이터 갱신

# 금요일 21:00 KST = 금요일 12:00 UTC
# (장 마감 15:30 후 5시간 30분 — KRX 투자자별 거래실적 확정 대기)
on:
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

# 데이터 커밋·푸시 권한
permissions:
  contents: write

concurrency:
  group: weekly-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    # 로컬(국내 IP) 실행이 약 68분. GitHub 러너는 미국 IP라 KRX 왕복이 더 느려
    # 60분으로는 매번 타임아웃된다(실측: 정확히 60분에 cancelled). 공개 저장소라
    # Actions 사용량 제한이 없으므로 넉넉히 잡는다.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pykrx는 로컬 배치 전용이라 requirements.txt에 없다(배포 런타임에 불필요).
      # 여기서만 따로 설치한다.
      - name: 의존성 설치
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q pandas numpy requests beautifulsoup4 pykrx

      - name: 배치 실행 · 커밋 · 푸시
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: bash scripts/run_weekly.sh

      # 실패해도 어디까지 됐는지 보이도록 산출물을 남긴다
      - name: 산출물 업로드 (실패 시 진단용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: data/*.json
          retention-days: 7
